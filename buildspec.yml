version: 0.2

env:
  parameter-store:
    ECR_URI: "/shopping-portal/ecr/uri"

  variables:
    AWS_REGION: "eu-west-1"

phases:
  install:
    commands:
      - echo Installing kubectl...
      - 'curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"'
      - chmod +x ./kubectl
      - mv ./kubectl /usr/local/bin/

  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - 'ECR_REPO_URI="${ECR_URI%:*}"'
      - echo "ECR repository configured"
      - 'aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REPO_URI'
      - 'COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_COMMIT_ID | cut -c 1-7)'
      - 'IMAGE_TAG=${COMMIT_HASH:-latest}'
      - 'echo "Image tag: $IMAGE_TAG"'

  build:
    commands:
      - echo Building Docker Image...
      - 'docker build -t $ECR_REPO_URI:latest .'
      - 'docker tag $ECR_REPO_URI:latest $ECR_REPO_URI:$IMAGE_TAG'

  post_build:
    commands:
      - echo Pushing Docker Image to ECR...
      - docker push $ECR_REPO_URI:latest
      - docker push $ECR_REPO_URI:$IMAGE_TAG
      - echo Updating kubeconfig for EKS Cluster...
      - aws eks update-kubeconfig --region $AWS_REGION --name online-shopping-cluster
      - echo Applying Kubernetes manifests...
      - kubectl apply -f namespace.yml
      - kubectl apply -f deployment.yml
      - kubectl apply -f service.yml
      - echo Build and Deployment Completed Successfully!


