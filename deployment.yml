apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-portal
  namespace: shopping-portal

spec:
  replicas: 2

  selector:
    matchLabels:
      app: shopping-portal

  template:
    metadata:
      labels:
        app: shopping-portal

    spec:
      containers:
        - name: shopping-portal
          image: 337909783979.dkr.ecr.eu-west-1.amazonaws.com/shopping-portal-repo:latest
          ports:
            - containerPort: 80
